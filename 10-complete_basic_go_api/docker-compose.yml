services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_ENV: development
      API_HTTP_ADDR: ":8080"
      API_STORE: postgres
      API_DATABASE_URL: postgres://api:api@db:5432/api?sslmode=disable
      API_JWT_SECRET: dev-only-secret-change-me-32chars!!
      API_CORS_ORIGINS: http://localhost:3000
      API_AUTO_MIGRATE: "true"
      API_TRUST_PROXY: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
